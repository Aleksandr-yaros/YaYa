<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ЯЯ·ФАБРИКА v10.2 — Live Demo</title>
<style>
:root{--bg:#0b1020;--panel:#131a2e;--panel2:#1b2440;--text:#eef3ff;--muted:#9fb0d0;--accent:#7c5cff;--ok:#2dd4bf;--warn:#f59e0b;--bad:#ef4444;--line:#2b3657}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;background:rgba(11,16,32,.96);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.brand{font-weight:800}.brand b{color:var(--accent)}.badge{padding:5px 9px;border-radius:999px;background:var(--panel2);color:var(--muted);font-size:12px}
.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 64px)}aside{border-right:1px solid var(--line);padding:14px;background:#0d1326;overflow:auto}.nav{display:grid;gap:6px}.nav button{width:100%;text-align:left;background:transparent;color:var(--muted);border:1px solid transparent;border-radius:10px;padding:10px;cursor:pointer}.nav button.active,.nav button:hover{background:var(--panel);color:var(--text);border-color:var(--line)}main{padding:20px;overflow:auto}
.screen{display:none}.screen.active{display:block}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:linear-gradient(180deg,var(--panel),#10172a);border:1px solid var(--line);border-radius:14px;padding:16px}.card h3{margin:0 0 10px}.metric{font-size:30px;font-weight:800}.muted{color:var(--muted)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.btn{background:var(--accent);color:white;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}.btn.secondary{background:var(--panel2);border:1px solid var(--line)}.btn.danger{background:#7f1d1d}
input,select,textarea{width:100%;background:#0f1630;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:10px;margin-top:6px}.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.bar{height:8px;background:#0e1530;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--accent))}.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.face{background:var(--panel2);border:1px solid var(--line);padding:10px;border-radius:12px;text-align:center;cursor:pointer}.face img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid var(--ok)}.face.busy img{border-color:var(--warn)}.face.off img{border-color:#64748b}.tiny{font-size:11px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#202a49;font-size:12px}.flow{display:flex;gap:8px;flex-wrap:wrap}.flow span{background:#17213d;border:1px solid var(--line);padding:8px 10px;border-radius:9px}.callout{border-left:4px solid var(--accent);padding:12px;background:#121a31;border-radius:8px}.bright{box-shadow:0 0 0 1px #f59e0b,0 0 28px rgba(245,158,11,.22)}
pre{white-space:pre-wrap;background:#0b1125;border:1px solid var(--line);padding:14px;border-radius:10px;color:#dbe7ff;max-height:420px;overflow:auto}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{position:static;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(2,1fr)}.g2,.g3,.g4{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="brand"><b>∞ЯЯ</b> · ФАБРИКА v10.2</div><div class="row"><span class="badge">synthetic-only</span><span class="badge">C3 / E2</span><span class="badge">«Ярос»</span></div></header>
<div class="layout"><aside><div class="nav" id="nav"></div></aside><main id="main"></main></div>
<script>
const names=['01. Пульс директора','02. Telegram 3×3','03. Создание сотрудника','04. Паспорт бота','05. Каталог функций','06. Интеграции','07. Field Mapping','08. Пользователи','09. Роли RBAC','10. Политики ABAC','11. Согласия и основания','12. Секреты и сертификаты','13. Центр звонков','14. Карточка звонка','15. Расшифровка','16. AI-анализ','17. План действий','18. Подтверждения','19. Очередь исполнения','20. Evidence Ledger','21. Аудит прослушиваний','22. Retention и инциденты','23. Usage & Billing','24. IMPACT / SLM / Запуск'];
const nav=document.getElementById('nav'), main=document.getElementById('main');
function card(t,b,c=''){return `<div class="card ${c}"><h3>${t}</h3>${b}</div>`}
function metric(v,l,cl=''){return `<div class="metric ${cl}">${v}</div><div class="muted">${l}</div>`}
function table(headers,rows){return `<table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
const employees=['Айжан','Бакыт','Диана','Егор','Жанна','Илья','Камила','Лев','Мария'];
let usage=12847,cost=18420,limit=20000;
function faceGrid(){return `<div class="faces">${employees.map((n,i)=>`<div class="face ${i===1||i===5?'busy':i===7?'off':''}" onclick="listen('${n}')"><img src="https://api.dicebear.com/9.x/initials/svg?seed=${encodeURIComponent(n)}"><b>${n}</b><div class="tiny">${i===1||i===5?'звонок 03:'+(12+i):i===7?'офлайн':'свободен'}</div></div>`).join('')}</div>`}
function screens(i){const demos={0:`<div class="grid g4">${card('AI-запросы сегодня',metric(usage,'вызовов','warn'),'bright')}${card('Стоимость сегодня',metric(cost.toLocaleString('ru-RU')+' ₽','себестоимость'))}${card('Выручка MRR',metric('412 000 ₽','подписки'))}${card('Валовая маржа',metric('71%','после AI и инфраструктуры','ok'))}</div><br>${card('Эволюция','<div class="flow"><span>v8 физический контур</span><span>v9 директорский cockpit</span><span>v10 LOGOS·FABRIC</span><span>v10.1 24 экрана</span><span>v10.2 usage metering + billing</span></div>')}`,1:card('Telegram-панель 3×3',faceGrid()+'<p class="muted">Нажатие имитирует проверку полномочий и создаёт запись аудита. Реальный SIP не подключён.</p>'),2:`<div class="grid g2">${card('Мастер создания','<label>Название<input value="Помощник продаж"></label><label>Цель<textarea>Обрабатывать звонки, фиксировать задачи, готовить черновики.</textarea></label><label>Шаблон<select><option>Продажи</option><option>Сервис</option><option>Логистика</option></select></label><button class="btn" onclick="alert(\'Создан безопасный BotSpec Draft\')">Создать Draft</button>')}${card('Границы','<ul><li>нет прямых записей AI</li><li>доступ только через политики</li><li>для C2–C4 — подтверждение</li><li>демо без живых данных</li></ul>')}</div>`,3:card('Паспорт цифрового сотрудника',table(['Поле','Значение'],[['ID','BOT-SALES-001'],['Владелец','Директор по продажам'],['C/E','C3 / E2'],['Автономность','Draft only'],['Лимит AI','35 000 запросов/мес'],['Статус','PILOT READY']])),4:card('Каталог функций',table(['Функция','Адаптер','Стоимость/вызов'],[['Расшифровать звонок','STT','0,42 ₽/мин'],['Извлечь задачу','LLM','0,18 ₽'],['Создать лид','BitrixAdapter','0,04 ₽'],['Создать задачу','JiraAdapter','0,03 ₽'],['Отправить отчёт','TelegramAdapter','0,01 ₽']])),5:card('Интеграции','<div class="grid g3"><div class="card">SIP/IP-АТС<br><span class="ok">подготовлено</span></div><div class="card">1С 8.3<br><span class="warn">dry-run</span></div><div class="card">Bitrix24<br><span class="ok">sandbox</span></div><div class="card">Jira<br><span class="ok">sandbox</span></div><div class="card">Telegram<br><span class="ok">demo</span></div><div class="card">AI Server<br><span class="warn">metered gateway</span></div></div>'),6:card('Field Mapping',table(['Источник','Поле ЯЯ','Назначение'],[['pbx.call_id','Call.id','1С Документ Звонок'],['pbx.record_url','Evidence.source','Vault reference'],['bitrix.contact_id','Party.externalId','CRM'],['jira.issue_key','Action.externalId','Task tracking']])),7:card('Пользователи',table(['Пользователь','Организация','Запросы','Расход'],[['director@demo','Ярос',1240,'1 840 ₽'],['sales-1@demo','Партнёр РФ',3860,'5 420 ₽'],['support@demo','Партнёр КР',2110,'2 610 ₽']])),8:card('RBAC',table(['Роль','Разрешения'],[['Директор','создание, подтверждение, отчёты'],['Руководитель','просмотр, подтверждение в зоне'],['Оператор','работа с назначенными звонками'],['Аудитор','только Evidence Ledger'],['Биллинг-админ','тарифы, квоты, счета']])),9:card('ABAC',`<div class="callout">Доступ = роль + tenant + подразделение + цель + правовое основание + время + риск + состояние согласия.</div><br>${table(['Правило','Результат'],[['Прослушивание звонка другого отдела','Запрет'],['Свой сотрудник, активный звонок, C3','Требуется подтверждение'],['Демо tenant','Только synthetic data']])}`),10:card('Согласия и правовые основания',table(['Контур','Основание','Срок'],[['Запись звонка','согласие/законный интерес','12 мес'],['AI-анализ','договор + уведомление','6 мес'],['Обучение моделей','отдельное согласие','запрещено по умолчанию']])),11:card('Секреты и сертификаты','<div class="grid g2"><div><label>AI API key<input value="••••••••••••9K2P" disabled></label><label>SIP credential<input value="vault://tenant-01/sip/main" disabled></label></div><div><p>TLS: <span class="ok">valid</span></p><p>SRTP: <span class="warn">required in production</span></p><p>Rotation: 14 дней</p><button class="btn secondary">Запросить ротацию</button></div></div>'),12:card('Центр звонков',table(['CallID','Сотрудник','Статус','Длительность'],[['C-10421','Бакыт','в разговоре','03:14'],['C-10422','Илья','в разговоре','03:17'],['C-10420','Айжан','завершён','05:48']])),13:card('Карточка звонка','<div class="grid g2"><div><p><b>CallID:</b> C-10421</p><p><b>Клиент:</b> +7 *** ***-12-34</p><p><b>Запись:</b> signed URL, 5 мин</p><button class="btn" onclick="listen(\'Бакыт\')">Запросить прослушивание</button></div><div><p>Риск: C3</p><p>Основание: supervisor_quality</p><p>Политика: CALL-LISTEN-02</p></div></div>'),14:card('Расшифровка','<pre>[00:02] Клиент: Нужна поставка к пятнице.\n[00:07] Менеджер: Проверю остатки и логистику.\n[00:18] Клиент: Отправьте предложение в Telegram.\n[00:25] Менеджер: Подготовлю сегодня.</pre>'),15:card('AI-анализ',`<div class="grid g3">${card('Намерение',metric('Покупка','confidence 0.92'))}${card('Следующее действие',metric('КП','до 18:00'))}${card('Риск',metric('Средний','нет подтверждённого остатка','warn'))}</div><br><button class="btn" onclick="consume()">Запустить повторный AI-анализ</button>`),16:card('План действий',table(['Действие','Статус','Стоимость'],[['Проверить остаток','draft','0,06 ₽'],['Создать КП','needs approval','0,24 ₽'],['Отправить Telegram','blocked until approval','0,01 ₽']])),17:card('Подтверждения','<div class="callout">C3: требуется правило четырёх глаз. Подтверждение не означает исполнение — оно открывает Commit Boundary.</div><br><button class="btn">Подтвердить Dry-run</button> <button class="btn danger">Отклонить</button>'),18:card('Очередь исполнения',table(['Action','Executor','Попытки','Статус'],[['A-901','OneCAdapter','1','success'],['A-902','BitrixAdapter','2','retry 30s'],['A-903','TelegramAdapter','0','waiting approval']])),19:card('Evidence Ledger',table(['EvidenceID','Тип','Хэш','Связь'],[['E-501','original recording','sha256:8aa…','C-10421'],['E-502','transcript','sha256:31b…','C-10421'],['E-503','AI result','sha256:991…','A-902']])),20:card('Аудит прослушиваний',`<div id="audit">${table(['Время','Кто','Объект','Результат'],[['21:18','director@demo','C-10421','allowed'],['20:54','operator@demo','C-10418','denied']])}</div>`),21:card('Retention и инциденты',table(['Политика','Срок','Действие'],[['Записи звонков','12 мес','удаление + evidence'],['Расшифровки','6 мес','удаление'],['Billing events','5 лет','архив'],['Security audit','3 года','WORM storage']])),22:`<div class="grid g4">${card('Запросы',metric(usage,'текущий месяц','warn'),'bright')}${card('Квота',metric(limit,'в тарифе'))}${card('Себестоимость',metric(cost.toLocaleString('ru-RU')+' ₽','AI + STT'))}${card('Прогноз',metric('27 430 ₽','к концу месяца'))}</div><br>${card('Монетизация РФ/СНГ',table(['Тариф','Цена/мес','Включено','Сверх лимита'],[['Старт','19 900 ₽','20k AI запросов','1,20 ₽/запрос'],['Бизнес','59 900 ₽','80k','0,85 ₽/запрос'],['Профи','149 900 ₽','250k','0,58 ₽/запрос'],['Enterprise','индивидуально','pool + SLA','по договору']]))}<br>${card('Правило защиты маржи','Квота считается по UsageEvent. При 80% — предупреждение, при 100% — soft limit, при 110% — только критические функции или автоматическое докупание пакета. Клиент видит стоимость по пользователю, боту, функции и проекту.')}`,23:`<div class="grid g3">${card('IMPACT',metric('312 ч','сэкономлено'))}${card('TCO',metric('184 000 ₽','месяц'))}${card('SLM',metric('C3 / E2','ΔM=1.0'))}</div><br>${card('Чек-лист запуска','<ol><li>SPEC·GUARD</li><li>Threat model</li><li>Dry-run</li><li>Проверка тарифов и квот</li><li>Commit Boundary</li><li>Pilot CALL-001</li><li>Evidence + IMPACT</li><li>Rollback test</li></ol><button class="btn" onclick="copySpec()">Скопировать итоговое ТЗ</button>')}`};return demos[i]}
for(let i=0;i<24;i++){const b=document.createElement('button');b.textContent=names[i];b.onclick=()=>show(i);nav.appendChild(b);const s=document.createElement('section');s.className='screen';s.id='s'+i;s.innerHTML=`<h1>${names[i]}</h1>${screens(i)}`;main.appendChild(s)}
function show(i){document.querySelectorAll('.nav button').forEach((x,j)=>x.classList.toggle('active',i===j));document.querySelectorAll('.screen').forEach((x,j)=>x.classList.toggle('active',i===j));location.hash='screen-'+(i+1)}
function consume(){usage++;cost+=0.18;alert('UsageEvent записан: пользователь, бот, функция, модель, токены, себестоимость, tenant. Новый расход: '+cost.toFixed(2)+' ₽');show(22)}
function listen(name){alert('Synthetic demo: Policy Check → доступ разрешён руководителю → AuditEvent создан для '+name)}
const spec=`ЯЯ·ФАБРИКА v10.2 — ИТОГОВОЕ ТЕХНИЧЕСКОЕ ЗАДАНИЕ\n\nЦель: создать готовый продукт фабрики управляемых цифровых сотрудников компании «Ярос» с единым контуром SIP/IP-АТС, 1С 8.3, Bitrix24, Jira, Telegram и AI Server.\n\nОбязательные блоки: 24 интерактивных экрана; Telegram-панель 3×3; загрузка 9 фотографий; статусы и длительность звонков; разрешённое SIP-прослушивание; аудит; 10 отраслевых шаблонов; masked secrets; TLS/SRTP; RBAC+ABAC; согласия; retention; ошибки; Evidence Ledger; IMPACT; SLM; чек-лист запуска.\n\nУчёт AI: каждый вызов создаёт UsageEvent с tenantId, userId, botId, functionId, modelId, token/input/output, duration, provider cost, internal cost, customer price, currency, timestamp, requestId и evidence. Агрегация обязательна по организации, пользователю, боту, функции, проекту и периоду.\n\nМонетизация: подписки Старт, Бизнес, Профи, Enterprise; включённые квоты; сверхлимитная тарификация; пакеты запросов; soft/hard limits; предупреждения 50/80/100%; защита маржи; счёт и акт; партнёрская модель white-label для РФ/СНГ; запрет скрытого перерасхода.\n\nБезопасность: AI не пишет напрямую; C2–C4 проходят SPEC·GUARD, dry-run, подтверждение, Commit Boundary, Evidence Ledger, IMPACT и rollback. Демо synthetic-only и не подключается к production без отдельного разрешения.`;
function copySpec(){navigator.clipboard.writeText(spec).then(()=>alert('Итоговое ТЗ скопировано'))}
show(Math.max(0,Math.min(23,(parseInt(location.hash.replace('#screen-',''))||1)-1)));
</script>
</body></html>

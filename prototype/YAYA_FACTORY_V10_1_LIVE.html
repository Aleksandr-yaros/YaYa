<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ЯЯ·ФАБРИКА v10.1</title><style>
:root{--b:#07111f;--p:#10233a;--l:#2b4563;--t:#eef6ff;--m:#9db1c8;--c:#22d3ee;--g:#22c55e;--y:#facc15;--o:#fb923c;--r:#ef4444;--v:#a78bfa}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px/1.45 system-ui}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{height:100vh;overflow:auto;position:sticky;top:0;background:#050d18;border-right:1px solid var(--l);padding:15px}.brand{padding:8px 8px 15px;border-bottom:1px solid var(--l);margin-bottom:8px}.brand b{font-size:18px}.brand small{display:block;color:var(--m)}nav button{display:block;width:100%;border:0;background:transparent;color:#c8d6e7;padding:8px;border-radius:8px;text-align:left}nav button:hover,nav button.on{background:#17314d;color:#fff}.top{position:sticky;top:0;z-index:3;background:#07111fee;border-bottom:1px solid var(--l);padding:12px 20px;display:flex;justify-content:space-between;align-items:center}.tag{border:1px solid var(--l);border-radius:20px;padding:5px 9px;margin-left:5px}.demo{color:#fde68a;background:#2a1b05}.ok{color:#86efac;background:#092619}.content{padding:20px;max-width:1500px;margin:auto}.screen{display:none}.screen.on{display:block}.head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:15px}.head h1{margin:0;font-size:27px}.head p,.muted{color:var(--m)}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card,.kpi{background:linear-gradient(#12263e,#0b1b2e);border:1px solid var(--l);border-radius:14px;padding:14px}.kpi strong{display:block;font-size:25px}.kpi.red{border-color:#7f1d1d}.kpi.orange{border-color:#854d0e}.kpi.violet{border-color:#5b21b6}.btn{border:1px solid #355777;background:#153655;color:#fff;border-radius:9px;padding:8px 11px}.btn.primary{background:linear-gradient(135deg,#0891b2,#2563eb)}.btn.red{background:#48151b;border-color:#991b1b}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.overview button{min-height:90px;background:#0e233a;border:1px solid var(--l);border-radius:11px;color:#fff;text-align:left;padding:11px}.overview span{color:var(--c);font-weight:800}.overview small{display:block;color:var(--m);margin-top:4px}.people{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.person{text-align:center}.avatar{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;margin:auto;background:#1a4961;border:3px solid #3b6383;font-size:24px;font-weight:800;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.status{display:inline-block;padding:4px 8px;border-radius:20px;border:1px solid var(--l);font-size:11px}.call{color:#fca5a5}.idle{color:#86efac}.busy{color:#fdba74}.timer{font:700 22px monospace;margin:8px}input,select,textarea{background:#061522;color:#fff;border:1px solid #31506e;border-radius:8px;padding:8px;max-width:100%}textarea{width:100%;min-height:100px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:grid;gap:4px;color:var(--m)}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:9px;border-bottom:1px solid #223a54;text-align:left}th{color:#9eb2c9;font-size:11px}.scroll{overflow:auto;border:1px solid var(--l);border-radius:11px}.bar{height:11px;background:#06131f;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--r))}.log,.spec{background:#05111e;border:1px solid var(--l);border-radius:10px;padding:11px;font:12px/1.5 monospace;max-height:400px;overflow:auto;white-space:pre-wrap}.heat{display:grid;grid-template-columns:140px repeat(5,1fr);gap:4px}.heat div{padding:8px;border-radius:6px;text-align:center;background:#10243a}.h1{background:#0d3924!important}.h2{background:#67520a!important}.h3{background:#7c2d12!important}.h4{background:#7f1d1d!important}.hp{background:#4c1d95!important}.toast{position:fixed;right:18px;bottom:18px;padding:11px 14px;border:1px solid #3b6383;background:#102c47;border-radius:10px;display:none}.toast.on{display:block}@media(max-width:1000px){.app{grid-template-columns:1fr}aside{display:none}.overview{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.g2,.g3,.g4,.people,.form{grid-template-columns:1fr}.overview{grid-template-columns:1fr}.tags{display:none}.content{padding:12px}}
</style></head><body><div class="app"><aside><div class="brand"><b>∞ЯЯ · ФАБРИКА</b><small>v10.1 AI Commerce Live<br>Компания «Ярос»</small></div><nav id="nav"></nav></aside><main><div class="top"><b id="title">01 · Директорский пульс</b><div class="tags"><span class="tag ok">● работает</span><span class="tag demo">SYNTHETIC ONLY</span><span class="tag">C3/E2→E4</span></div></div><div class="content" id="content"></div></main></div><div class="toast" id="toast"></div><script>
const S=[['Директорский пульс','Состояние, звонки, задачи, AI-затраты и маржа'],['Telegram-панель 3×3','9 лиц, фото, статусы, SIP и аудит'],['Каталог сотрудников','Все цифровые сотрудники'],['Создание сотрудника','No-code BotSpec Draft'],['Паспорт сотрудника','Полномочия, KPI, C/E и rollback'],['10 отраслевых шаблонов','Готовые draft-сценарии'],['Интеграции','SIP, Telegram, Битрикс24, Jira, 1С'],['Field Mapping','Сопоставление полей'],['Пользователи и структура','Tenant, отделы, лимиты'],['Роли RBAC/ABAC','Матрица полномочий'],['Согласия и основания','Правовые основания'],['Секреты и сертификаты','Vault и masking'],['Call Hub','Единый поток звонков'],['Карточка звонка','Факты, evidence, стоимость'],['Расшифровка и AI','Факты и выводы'],['Действия и подтверждения','Dry-run и Commit Boundary'],['Очередь исполнения','Адаптеры и retry'],['Evidence Ledger','Неизменяемые доказательства'],['Аудит SIP','Прослушивания и отказы'],['Retention и удаление','Сроки хранения'],['Ошибки и rollback','Инциденты и восстановление'],['Пульс AI-затрат','Запросы, подписки, лимиты'],['IMPACT, SLM, монетизация','ROI и unit economics'],['Запуск и эволюция','Simulation Lab и итоговое ТЗ']];
const E=[['Айжан','Продажи','call',187,128,386],['Тимур','Сервис','idle',0,94,242],['Динара','Секретарь','call',64,83,196],['Руслан','Логистика','busy',0,77,228],['Эльмира','Документы','idle',0,65,174],['Бакыт','Контроль','call',421,151,512],['Нурия','Маркетинг','offline',0,54,138],['Арсен','Снабжение','idle',0,101,304],['Гаухар','Директорский бот','busy',0,207,788]];
const T=['Продажи','Сервис и поддержка','Медицина без диагноза','Образование','Строительство','Логистика','Розница','Гостиницы и рестораны','Профессиональные услуги','Внутренний офис'];let audit=[],usage=8420,cost=22740;
const $=q=>document.querySelector(q),fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'),say=m=>{let x=$('#toast');x.textContent=m;x.classList.add('on');setTimeout(()=>x.classList.remove('on'),1800)};
$('#nav').innerHTML=S.map((x,i)=>`<button onclick="go(${i+1})" data-n="${i+1}">${String(i+1).padStart(2,'0')} · ${x[0]}</button>`).join('');
function go(n){$('#title').textContent=String(n).padStart(2,'0')+' · '+S[n-1][0];document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',+b.dataset.n===n));$('#content').innerHTML=render(n);if(n===2)people();if(n===22)billing();location.hash='screen-'+n}
function head(n,extra=''){return `<div class="head"><div><h1>${S[n-1][0]}</h1><p>${S[n-1][1]}</p></div>${extra}</div>`}
function render(n){if(n===1)return dash();if(n===2)return head(n,`<select id="role"><option value="director">Директор</option><option value="supervisor">Руководитель</option><option value="operator">Оператор</option></select>`)+`<div class="people" id="people"></div>`;if(n===4)return create();if(n===6)return head(n)+`<div class="grid g2">${T.map((x,i)=>`<div class="card"><h3>${i+1}. ${x}</h3><p>Draft-профиль с событиями, функциями, запретами, KPI, C/E и AI-лимитом.</p><span class="tag demo">DRAFT ONLY</span></div>`).join('')}</div>`;if(n===8)return mapping();if(n===18||n===19)return head(n)+`<div class="log">${(n===19?(audit.length?audit:['Журнал пуст. Откройте экран 02 и нажмите SIP.']):['EV-801 AI_RESULT hash:ab91 cost:14.20','EV-800 TRANSCRIPT hash:7c21 FACT','EV-799 CALL_RECORD hash:94de FACT']).join('\n')}</div>`;if(n===22)return bill();if(n===23)return money();if(n===24)return evolution();return generic(n)}
function dash(){return head(1,`<button class="btn primary" onclick="go(4)">＋ Создать бота ЯЯ</button>`)+`<div class="grid g4"><div class="kpi"><small>Цифровые сотрудники</small><strong>9</strong><span class="muted">3 на звонках</span></div><div class="kpi orange"><small>AI-запросы сегодня</small><strong>960</strong><span class="muted">+14%</span></div><div class="kpi red"><small>Расход бюджета</small><strong>91%</strong><span class="muted">лимит близко</span></div><div class="kpi violet"><small>Валовая маржа</small><strong>67%</strong><span class="muted">прогноз</span></div></div><div class="card" style="margin-top:12px"><h3>AI-бюджет Tenant</h3><div class="bar"><i style="width:91%"></i></div><p>22 740 из 25 000 AI-кредитов. Перерасход не возникает молча.</p></div><div class="card" style="margin-top:12px"><h3>Все 24 экрана</h3><div class="overview">${S.map((x,i)=>`<button onclick="go(${i+1})"><span>${String(i+1).padStart(2,'0')}</span> <b>${x[0]}</b><small>${x[1]}</small></button>`).join('')}</div></div>`}
function people(){let p=$('#people');p.innerHTML=E.map((e,i)=>`<div class="card person"><label class="avatar" onclick="sip(${i})" id="a${i}">${e[0][0]}</label><h3>${e[0]}</h3><span class="status ${e[2]}">${e[2]==='call'?'● Разговор':e[2]==='idle'?'● Доступен':'● Занят'}</span><div class="timer">${e[2]==='call'?fmt(e[3]):'—'}</div><small>${e[4]} req · ${e[5]} ₽</small><div><label class="btn">Фото<input hidden type="file" accept="image/*" onchange="photo(${i},this)"></label> <button class="btn" onclick="sip(${i})">SIP</button></div></div>`).join('')}
function photo(i,x){let f=x.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{$('#a'+i).innerHTML=`<img src="${r.result}">`;say('Фото загружено локально')};r.readAsDataURL(f)}
function sip(i){let role=$('#role').value,ok=['director','supervisor'].includes(role)&&E[i][2]==='call';audit.unshift(`${new Date().toLocaleString('ru-RU')} ${ok?'ALLOWED':'DENIED'} user=${role} employee=${E[i][0]} basis=${ok?'quality_control':'no_permission_or_call'}`);say(ok?'Synthetic SIP открыт; событие записано':'Доступ отклонён и записан')}
function create(){return head(4)+`<div class="card"><div class="form"><label>Имя<input id="bn" value="Новый бот ЯЯ"></label><label>Должность<input id="br" value="Менеджер заявок"></label><label>Шаблон<select>${T.map(x=>`<option>${x}</option>`).join('')}</select></label><label>AI-лимит<input value="3000" type="number"></label><label>C<select><option>C2</option><option>C3</option></select></label><label>E<select><option>E2</option><option>E3</option></select></label></div><p><textarea>Принимать обращения, готовить разрешённые действия и передавать их на подтверждение.</textarea></p><button class="btn" onclick="say('Dry-run PASS; production=false')">Dry-run</button> <button class="btn primary" onclick="say('BotSpec Draft создан')">Создать DRAFT</button></div>`}
function mapping(){return head(8)+`<div class="grid g2"><div class="card"><h3>Новое правило</h3><div class="form"><select><option>call.phone</option><option>ai.intent</option><option>usage.fullCost</option></select><select><option>CRM.Телефон</option><option>Jira.Summary</option><option>1C.Сумма</option></select></div><p><button class="btn primary" onclick="say('Mapping добавлен')">Добавить</button></p></div><div class="card"><h3>Preview</h3><div class="log">{ "source": "+7 999...", "target": "+7999...", "validation": "PASS", "productionWrite": false }</div></div></div>`}
function generic(n){let rows=['Owner: компания «Ярос»','Tenant isolation: ON','Production access: OFF','Evidence Ledger: ON','Commit Boundary: REQUIRED'];return head(n)+`<div class="grid g3"><div class="card"><h3>Назначение</h3><p>${S[n-1][1]}. Экран входит в единый контур LOGOS·FABRIC и связан с 1С 8.3.</p></div><div class="card"><h3>Управление</h3>${rows.map(x=>`<p>✓ ${x}</p>`).join('')}</div><div class="card"><h3>Демо-действие</h3><p>Все действия синтетические, журналируются и не вызывают production API.</p><button class="btn" onclick="say('Synthetic действие выполнено')">Выполнить</button></div></div><div class="card" style="margin-top:12px"><h3>Рабочая таблица</h3><div class="scroll"><table><tr><th>ID</th><th>Объект</th><th>Статус</th><th>C/E</th><th>Evidence</th><th>Стоимость</th></tr>${[1,2,3,4].map(i=>`<tr><td>${String(n).padStart(2,'0')}-${i}</td><td>${S[n-1][0]} ${i}</td><td>${i===2?'REVIEW':'ACTIVE'}</td><td>C${i%3+1}/E2</td><td>EV-${n}${i}0</td><td>${i*7},40 ₽</td></tr>`).join('')}</table></div></div>`}
function bill(){return head(22,`<button class="btn primary" onclick="addReq()">＋ Synthetic запрос</button>`)+`<div class="grid g4"><div class="kpi orange"><small>Запросы/месяц</small><strong id="rq">${usage}</strong></div><div class="kpi red"><small>Full cost</small><strong id="co">${cost.toLocaleString('ru-RU')} ₽</strong></div><div class="kpi"><small>Начислено</small><strong>68 270 ₽</strong></div><div class="kpi violet"><small>Маржа</small><strong>45 530 ₽</strong></div></div><div class="card" style="margin-top:12px"><h3>Лимит подписки</h3><div class="bar"><i id="bb" style="width:${Math.min(100,cost/250)}%"></i></div><p>${cost.toLocaleString('ru-RU')} / 25 000 кредитов · hard limit · overage только с подтверждением</p></div><div class="card" style="margin-top:12px"><h3>Тепловая карта запросов</h3><div class="heat">${['Пользователь','cost-mini','reasoning','STT','local','tools','Александр','180','92','140','48','27','Марина','130','55','88','39','42','Иван','72','34','120','61','20'].map((x,i)=>`<div class="${i>5?(+x>140?'h4':+x>90?'h3':+x>50?'h2':'h1'):''}">${x}</div>`).join('')}</div></div><div class="grid g2" style="margin-top:12px"><div class="card"><h3>По пользователям</h3><p>Александр — 2 240 req / 6 720 ₽ / 84%</p><p>Марина — 1 830 req / 4 930 ₽ / 99%</p><p>Иван — 1 110 req / 2 280 ₽ / 76%</p></div><div class="card"><h3>По ботам</h3>${E.slice(0,5).map(e=>`<p>${e[0]} — ${e[4]} req / ${e[5]} ₽</p>`).join('')}</div></div>`}
function billing(){say('Экран AI Usage & Billing открыт')}
function addReq(){usage++;cost+=17;$('#rq').textContent=usage;$('#co').textContent=cost.toLocaleString('ru-RU')+' ₽';say('UsageEvent создан: user + bot + task + model + cost')}
function money(){return head(23)+`<div class="grid g4"><div class="kpi"><small>IMPACT</small><strong>284 000 ₽</strong></div><div class="kpi violet"><small>AI ROI</small><strong>4,2×</strong></div><div class="kpi"><small>MRR</small><strong>79 900 ₽</strong></div><div class="kpi orange"><small>COGS</small><strong>26 800 ₽</strong></div></div><div class="grid g2" style="margin-top:12px"><div class="card"><h3>Модель «Ярос»</h3><p>Подписка за цифровой штат + включённый AI-бюджет + прозрачный перерасход + модули + внедрение + партнёрская комиссия + доля от доказанного результата.</p><b>Клиент продаёт свою услугу и результат, а не токены.</b></div><div class="card"><h3>Стартовые гипотезы</h3><p>Старт — 9 900 ₽</p><p>Команда — 29 900 ₽</p><p>Бизнес — 79 900 ₽</p><p>Корпоративный — от 249 000 ₽</p></div></div>`}
function evolution(){return head(24,`<button class="btn primary" onclick="copyTask()">Скопировать итоговое ТЗ</button>`)+`<div class="grid g2"><div class="card"><h3>Эволюция</h3><p>v8 → физическая архитектура</p><p>v9.1 → Director Visual Intelligence</p><p>v10 → LOGOS·FABRIC и единый канон</p><p><b>v10.1 → 24 экрана + AI Commerce Live</b></p></div><div class="card"><h3>Чек-лист</h3><p>✓ 24 экрана</p><p>✓ 9 фото и панель 3×3</p><p>✓ 10 шаблонов</p><p>✓ AI Usage & Billing</p><p>✓ synthetic-only boundary</p><p>○ Merge PR после утверждения</p></div></div><div class="card" style="margin-top:12px"><h3>Итоговое задание</h3><div class="spec" id="spec">Создать ЯЯ·ФАБРИКУ v10.1 компании «Ярос»: 24 интерактивных экрана, 10 отраслевых шаблонов, Telegram-панель 3×3, загрузка девяти фотографий, статусы и длительность звонков, разрешённый SIP с аудитом, no-code BotSpec Draft, интеграции, Field Mapping, RBAC/ABAC, согласия, Vault/masked secrets, Call Hub, расшифровка и AI-анализ, ActionInstances, Commit Boundary, очередь, Evidence Ledger, retention, инциденты и rollback. Добавить AI Usage & Billing: считать каждый запрос по Tenant, пользователю, цифровому сотруднику, задаче, модели и поставщику; учитывать токены, STT, tools, storage и API; разделять FACT/ESTIMATED; исключить двойное начисление; управлять подпиской, AI-кредитами, лимитами 70/80/90/100%, hard limit, overage, прогнозом и маржой. Коммерческая модель: подписка за цифровой штат + включённый AI-бюджет + прозрачный перерасход + платные модули + внедрение + партнёрская комиссия + outcome-based доля только от доказанного IMPACT. Демо строго synthetic-only и не подключается к живым данным, SIP, CRM, AI или платежам без отдельного разрешения.</div></div>`}
function copyTask(){navigator.clipboard?.writeText($('#spec').innerText);say('Итоговое задание скопировано')}
setInterval(()=>{E.forEach(e=>{if(e[2]==='call')e[3]++});if($('#people'))people()},1000);let h=location.hash.match(/screen-(\d+)/);go(h?+h[1]:1);
</script></body></html>
